<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Ultimate Cookie Clicker</title>

  <style>
    body {
      font-family: 'Roman empire', sans-serif;
      text-align: center;
      background-color: #c4a82d;
      padding: 40px;
    }

    h1 {
      font-size: 48px;
      color: #8B4513;
      text-transform: uppercase;
    }

    h2 {
      font-size: 28px;
      color: #a0522d;
    }

    #send img {
      width: 230px;
      height: 230px;
      transition: transform 0.1s;
      transform-origin: center;

    }

    #send {
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 30px;
      position: relative;
      z-index: 1000;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(0.8); }
      100% { transform: scale(1); }
    }

    .cookie-pop {
      animation: pop 0.25s ease;
    }

    .flying-cookie {
      position: absolute;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: fly 1s ease-out forwards;
      z-index: 999;
    }

    @keyframes fly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; }
    }


    #cookies {
      font-size: 32px;
      color: #a0522d;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>The Ultimate Cookie Clicker</h1>
  <h2>Click the cookie to get a cookie!</h2>

  <button id="send">
    <img src="Cookie.png" alt="Cookie image not found" />
  </button>

  <div id="cookies">0</div>

  <script src="client.js"></script>
</body>
</html>
