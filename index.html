<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Ultimate Cookie Clicker</title>
  

  <style>
    body {
      font-family: 'Roman empire', sans-serif;
      text-align: center;
      background-color: #c4a82d;
      padding: 40px;
      overflow: hidden;
    }

    h1 {
      font-size: 48px;
      color: #8B4513;
      text-transform: uppercase;
    }

    h2 {
      font-size: 28px;
      color: #a0522d;
    }

    h3 {
      font-size: 10px;
      color: #8B4513;
      margin-top: 10px;
      position: absolute;
      text-align: right;
      bottom: 0;
      right: 10px;
    }

    #btnCookie img {
      width: 280px;
      height: 280px;
      transition: transform 0.1s;
      transform-origin: center;

    }

    #btnCookie {
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 30px;
      position: relative;
      z-index: 1000;
      border-radius: 50%;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
    }

    button:focus {
      outline: none;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(0.8); }
      100% { transform: scale(1); }
    }

    .cookie-pop {
      animation: pop 0.25s ease;
    }

    .flying-cookie {
      position: absolute;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: fly 1s ease-out forwards;
      z-index: 999;
    }

    @keyframes fly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; }
    }


    #cookies {
      font-size: 40px;
      color: #a0522d;
      margin-top: 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
    h1 {
      font-size: 30px;
    }

    h2 {
      font-size: 20px;
    }

    #btnCookie img {
      width: 200px;
      height: 200px;
    }

    #cookies {
      font-size: 25px;
    }

    .flying-cookie {
      width: 30px;
      height: 30px;
    }

    h3 {
      font-size: 8px;
      right: 5px;
      bottom: 5px;
    }

    body {
      padding: 20px;
  }
}

  </style>
</head>

<body>
  <h1>The Ultimate Cookie Clicker</h1>
  <h2>Click the cookie to get a cookie!</h2>
  
  <button id="btnCookie">
      <img src="Cookie.png" alt="Cookie image not found" />
    </button>
    
  <div id="cookies"></div>
    
  <h3>Github:</br>https://github.com/AltsuW69/Ultimate-Cookie-clicker</h3>

  <script src="client.js"></script>
</body>
</html>
